<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ITXLM Tools</title>
  <script src="auth.js"></script>
  <script>
    // Agar user pehle se logged in hai to direct index.html par bhejo
    redirectIfAuthenticated();
  </script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      padding: 20px;
    }

    .login-container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
    }

    .login-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #e0e7ff;
      color: var(--primary);
      border-radius: 12px;
      font-weight: 700;
      font-size: 22px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    }

    .brand-header h1 {
      font-size: 24px;
      color: var(--text-dark);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
    }

    .alert-danger {
      background-color: var(--danger-bg);
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .alert-success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s ease;
      color: var(--text-dark);
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      padding: 4px;
    }

    .toggle-pass-btn:hover {
      color: var(--text-dark);
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text-dark);
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .demo-credentials-card {
      margin-top: 24px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .demo-btn {
      background: #e2e8f0;
      border: none;
      color: #334155;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .demo-btn:hover {
      background: #cbd5e1;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="login-container" id="loginCard">
    <div class="brand-header">
      <div class="logo-badge">IT</div>
      <h1>ITXLM Tools Login</h1>
      <p>Enter your admin credentials to access your dashboard</p>
    </div>

    <!-- Alert Box -->
    <div class="alert alert-danger" id="errorAlert" role="alert">
      <span>⚠️</span>
      <span id="errorMessage">Invalid email or password!</span>
    </div>

    <div class="alert alert-success" id="successAlert" role="alert">
      <span>✅</span>
      <span>Login successful! Redirecting...</span>
    </div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label for="emailInput">Admin Email</label>
        <div class="input-wrapper">
          <input 
            type="email" 
            id="emailInput" 
            placeholder="admin@itxlm.com" 
            autocomplete="email" 
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            placeholder="Enter password" 
            autocomplete="current-password" 
            required
          />
          <button 
            type="button" 
            class="toggle-pass-btn" 
            id="togglePassword" 
            onclick="togglePasswordVisibility()"
            title="Show / Hide Password"
          >👁️</button>
        </div>
      </div>

      <div class="form-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>

    <div class="demo-credentials-card">
      <div>
        <strong>Default Admin:</strong><br>
        Email: <code>admin@itxlm.com</code><br>
        Pass: <code>admin123</code>
      </div>
      <button type="button" class="demo-btn" onclick="autoFillDemo()">Auto Fill</button>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById("passwordInput");
      const toggleBtn = document.getElementById("togglePassword");
      if (passInput.type === "password") {
        passInput.type = "text";
        toggleBtn.textContent = "🙈";
      } else {
        passInput.type = "password";
        toggleBtn.textContent = "👁️";
      }
    }

    function autoFillDemo() {
      document.getElementById("emailInput").value = "admin@itxlm.com";
      document.getElementById("passwordInput").value = "admin123";
      hideAlerts();
    }

    function hideAlerts() {
      document.getElementById("errorAlert").style.display = "none";
      document.getElementById("successAlert").style.display = "none";
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      hideAlerts();

      const email = document.getElementById("emailInput").value;
      const pass = document.getElementById("passwordInput").value;
      const remember = document.getElementById("rememberMe").checked;

      const result = performLogin(email, pass, remember);

      if (result.success) {
        document.getElementById("successAlert").style.display = "flex";
        document.getElementById("submitBtn").disabled = true;
        document.getElementById("submitBtn").textContent = "Redirecting...";

        setTimeout(() => {
          window.location.replace("index.html");
        }, 500);
      } else {
        const errorAlert = document.getElementById("errorAlert");
        const loginCard = document.getElementById("loginCard");
        document.getElementById("errorMessage").textContent = result.message;
        errorAlert.style.display = "flex";

        // Shake effect
        loginCard.classList.remove("shake");
        void loginCard.offsetWidth; // trigger reflow
        loginCard.classList.add("shake");
      }
    }
  </script>
</body>
</html>
